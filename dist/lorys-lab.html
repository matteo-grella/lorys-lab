<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lory's Lab">
<meta name="theme-color" content="#FBF1DE">



<title>Lory's Lab</title>
<style>
  :root {
    --ink: #43342B; --paper: #FFF9EE; --cream: #FBF1DE; --peach: #F5DFC3;
    --woodL: #EABF85; --woodM: #C9915A; --woodD: #8F6238;
    --blue: #4E86E0; --blueD: #3563B8; --sunny: #FFC53D; --tang: #FF8E3C;
    --poppy: #E8563F; --leaf: #5FB358; --sky: #7CC7E8; --blossom: #F2A0BD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #E9D9BE; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { font-family: ui-rounded, -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #app {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 830px;
    transform: translate(-50%, -50%);
    transform-origin: center center;
  }
  #game { width: 1280px; height: 830px; display: block; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(67,52,43,0.25); touch-action: none; }

  /* top bar */
  .topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .chip {
    background: var(--paper); border: none; border-radius: 28px;
    min-height: calc(52px * var(--uiboost, 1));
    padding: 0 20px; color: var(--ink);
    font: 700 calc(18px * var(--uiboost, 1)) ui-rounded, system-ui, sans-serif;
    box-shadow: 0 3px 0 rgba(67,52,43,0.25); display: flex; align-items: center; gap: 6px;
  }
  .chip.btn { cursor: pointer; min-width: calc(56px * var(--uiboost, 1)); justify-content: center;
    font-size: calc(22px * var(--uiboost, 1)); transition: transform 0.12s; }
  .chip.btn.labeled { font-size: 17px; background: var(--sunny); box-shadow: 0 3px 0 #C99A20; white-space: nowrap; }
  .chip.btn:hover { transform: scale(1.06); }
  .chip.btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0); }

  /* play button */
  .playbtn {
    position: absolute; right: 22px; bottom: 128px;
    width: calc(92px * var(--uiboost, 1)); height: calc(92px * var(--uiboost, 1));
    border-radius: 50%;
    border: none; background: var(--leaf); color: var(--paper);
    font-size: calc(40px * var(--uiboost, 1)); cursor: pointer;
    box-shadow: 0 6px 0 #3E8039, 0 10px 24px rgba(67,52,43,0.3);
    transition: transform 0.15s, background 0.25s, border-radius 0.25s;
  }
  .playbtn:hover { transform: scale(1.05); }
  .playbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3E8039; }
  .playbtn.running { background: var(--poppy); border-radius: 26px; box-shadow: 0 6px 0 #B93A28, 0 10px 24px rgba(67,52,43,0.3); }

  /* overlays */
  .overlay-root { position: absolute; inset: 0; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(#FBF1DE, #F5DFC3); border-radius: 18px; }
  .title-screen h1 { font-size: 74px; font-weight: 800; color: var(--ink); letter-spacing: 0.5px;
    text-shadow: 0 4px 0 rgba(201,145,90,0.4); }
  .title-screen .tag { font-size: 22px; color: #8C7A6B; font-weight: 600; margin-top: -8px; }
  .big {
    border: none; border-radius: 22px; min-width: 280px; min-height: 68px;
    font: 800 26px ui-rounded, system-ui, sans-serif; color: var(--paper); cursor: pointer;
    transition: transform 0.12s;
  }
  .big:hover { transform: scale(1.04); }
  .big:active { transform: translateY(3px); }
  .big.leaf { background: var(--leaf); box-shadow: 0 5px 0 #3E8039; }
  .big.blue { background: var(--blue); box-shadow: 0 5px 0 var(--blueD); }
  .mode-row { display: flex; gap: 12px; align-items: center; margin-top: 16px; font-weight: 700; color: #8C7A6B; flex-wrap: wrap; justify-content: center; }
  .mode { border: 3px solid rgba(67,52,43,0.15); background: var(--paper); border-radius: 18px; padding: 10px 18px;
    font: 700 17px ui-rounded, system-ui, sans-serif; color: var(--ink); cursor: pointer; }
  .mode small { display: block; font-weight: 600; color: #8C7A6B; }
  .mode.on { border-color: var(--blue); background: #EAF2FF; }
  .title-toggles { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
  .title-toggles .chip.btn { font-size: 16px; font-weight: 800; }
  .title-toggles .chip.btn.reset { font-size: 15px; color: var(--poppy); }
  .big.danger { background: var(--poppy); box-shadow: 0 5px 0 #B93A28; }
  .reset-warn { font-size: 17px; font-weight: 600; color: var(--ink); margin: 4px 0 18px; line-height: 1.4; }

  /* level select */
  .levels-screen { justify-content: flex-start; padding: 30px 60px; overflow: auto; }
  .lv-head { display: flex; align-items: center; gap: 16px; width: 100%; margin-bottom: 18px; }
  .lv-head h2 { font-size: 40px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; width: 100%; }
  .card {
    background: var(--paper); border: none; border-radius: 22px; padding: 18px 10px 14px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(67,52,43,0.2); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 128px;
    transition: transform 0.12s;
  }
  .card:hover { transform: scale(1.05); }
  .card .num { font-size: 34px; font-weight: 800; color: var(--blue); }
  .card .nm { font-weight: 700; font-size: 15px; text-align: center; line-height: 1.15; }
  .card .stars { color: var(--sunny); font-size: 17px; letter-spacing: 2px; }
  .card .stars .dim, .winstars .wstar { color: rgba(67,52,43,0.18); }
  .card.locked { opacity: 0.55; cursor: default; }
  .card.locked:hover { transform: none; }
  .card.sandbox .num { color: var(--tang); }

  /* win overlay */
  .dim-bg { position: absolute; inset: 0; background: rgba(67,52,43,0.35); border-radius: 18px; animation: fadein 0.2s; }
  .wincard {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--paper); border-radius: 32px; padding: 8px 46px 34px; text-align: center;
    border: 6px solid var(--woodL); outline: 2px solid var(--woodD);
    animation: popin 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .wincard h2 { font-size: 40px; font-weight: 800; margin: -26px 0 4px; }
  .wincard canvas { margin-top: -70px; }
  .winstars { font-size: 62px; letter-spacing: 8px; margin: 2px 0 14px; }
  .wstar { display: inline-block; transform: scale(0); animation: starpop 0.45s cubic-bezier(0.2, 1.8, 0.4, 1) forwards; }
  .wstar.earn { color: var(--sunny); text-shadow: 0 3px 0 rgba(67,52,43,0.2); }
  .row { display: flex; gap: 14px; justify-content: center; }
  .row .big { min-width: 170px; }

  /* my puzzles + name dialog */
  .lv-mine { width: 100%; margin-top: 22px; }
  .lv-mine h3 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
  .card.mine { position: relative; }
  .card.mine .num { color: var(--tang); }
  .pdel {
    position: absolute; top: 6px; right: 8px; font-size: 14px; font-weight: 800;
    color: var(--poppy); background: rgba(232,86,63,0.12); border-radius: 12px; padding: 3px 8px;
  }
  .pdel:hover { background: rgba(232,86,63,0.25); }
  .pedit {
    position: absolute; top: 6px; left: 8px; font-size: 14px; font-weight: 800;
    color: var(--blue); background: rgba(78,134,224,0.12); border-radius: 12px; padding: 3px 8px;
  }
  .pedit:hover { background: rgba(78,134,224,0.28); }
  .namecard { padding-top: 30px; }
  .namecard input {
    display: block; margin: 10px auto 20px; width: 320px; text-align: center;
    font: 700 24px ui-rounded, system-ui, sans-serif; color: var(--ink);
    background: var(--cream); border: 3px solid var(--woodL); border-radius: 16px; padding: 12px 16px;
    outline: none;
  }
  .namecard input:focus { border-color: var(--blue); }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); border-radius: 20px; padding: 12px 24px;
    font-weight: 700; font-size: 18px; opacity: 0; transition: 0.25s; pointer-events: none;
  }
  .toast.show { opacity: 0.95; transform: translateX(-50%); }

  /* portrait rotate nudge (unscaled, on top of everything) */
  #rotateOverlay {
    position: fixed; inset: 0; z-index: 99; display: none;
    align-items: center; justify-content: center;
    background: linear-gradient(#FBF1DE, #F5DFC3);
  }
  .ro-card {
    text-align: center; font: 800 22px ui-rounded, system-ui, sans-serif; color: var(--ink);
    padding: 30px; max-width: 320px;
  }
  .ro-icon { font-size: 64px; margin-bottom: 18px; animation: rotwiggle 1.6s ease-in-out infinite; }
  @keyframes rotwiggle { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }

  @keyframes fadein { from { opacity: 0; } }
  @keyframes popin { from { transform: translate(-50%, -46%) scale(0.7); opacity: 0; } }
  @keyframes starpop { to { transform: scale(1); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
</div>






<script>
// Offline support on the hosted site only (no-op for file:// and the
// single-file artifact build, where there is no sw.js to fetch).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // updateViaCache:'none' makes the browser re-check sw.js on every load
  // instead of trusting its HTTP cache for up to a day
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(function (reg) { reg.update().catch(function () {}); })
    .catch(function () {});
  // when a NEW version replaces the one controlling this page, reload once so
  // it applies immediately (guard: skip the initial claim on a first visit)
  var swHadController = !!navigator.serviceWorker.controller;
  var swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!swHadController || swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}
</script>

<script>
/* ==== src/core.js ==== */
/*
 * Lory's Lab — core simulation module.
 * Runs in the browser (window.LoryCore) and in Node (module.exports) so levels
 * can be verified headlessly. All physics behaviour lives here; rendering,
 * audio and UI live elsewhere and only consume bodies + events.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('../vendor/matter.min.js'));
  } else {
    root.LoryCore = factory(root.Matter);
  }
})(typeof self !== 'undefined' ? self : this, function (Matter) {
  'use strict';

  const { Engine, Bodies, Body, Composite, Constraint, Events, Query, Vector } = Matter;

  const WORLD = { w: 1280, h: 720, floorY: 690 };

  // Single source of truth for part geometry + behaviour flags.
  // placeable: can appear in the tray. rot: player-rotatable. dir: has a direction.
  const PART_DEFS = {
    plank:       { w: 160, h: 20,  static: true,  placeable: true, rot: true },
    trampoline:  { w: 110, h: 24,  static: true,  placeable: true },
    seesaw:      { w: 220, h: 16,  static: false, placeable: true },
    fan:         { w: 56,  h: 56,  static: true,  placeable: true, dir: ['right', 'left', 'up'] },
    domino:      { w: 16,  h: 56,  static: false, placeable: true },
    conveyor:    { w: 140, h: 26,  static: true,  placeable: true, dir: ['right', 'left'] },
    bumper:      { r: 26,          static: true,  placeable: true },
    magnet:      { w: 56,  h: 56,  static: true,  placeable: true },
    // machine-shop parts (sandbox tray; fully simulated, campaign untouched)
    rope:        { w: 28,  h: 18,  static: true,  placeable: true },  // anchor plate; tether hangs below
    scissors:    { w: 74,  h: 40,  static: true,  placeable: true, rot: true },
    candle:      { w: 26,  h: 58,  static: true,  placeable: true },
    fuse:        { w: 130, h: 12,  static: true,  placeable: true, rot: true },
    hydrant:     { w: 52,  h: 62,  static: true,  placeable: true, dir: ['right', 'left', 'up'] },
    switch:      { w: 84,  h: 20,  static: true,  placeable: true },
    fist:        { w: 66,  h: 46,  static: true,  placeable: true },
    balloon:     { r: 24,          static: false, placeable: true },
    bucket:      { w: 120, h: 90,  static: true,  placeable: true },
    ball_beach:  { r: 28,          static: false, placeable: true },
    ball_marble: { r: 18,          static: false, placeable: true },
    // Level furniture (not placeable by the player)
    shelf:       { w: 200, h: 24,  static: true,  rot: true, sizable: true },
    wall:        { w: 24,  h: 200, static: true,  sizable: true },
    berry:       { r: 16,          static: false },
    bowl:        { w: 130, h: 70,  static: true },
    bell:        { r: 30,          static: true },
    balloon_goal:{ r: 24,          static: false },
    spikes:      { w: 56,  h: 64,  static: true },  // potted cactus
    sparkle:     { r: 14,          static: true },
  };

  // Material sound classes used by the audio layer.
  const MATERIAL = {
    plank: 'wood', shelf: 'wood', wall: 'wood', seesaw: 'wood', domino: 'domino',
    bucket: 'wood', conveyor: 'wood', trampoline: 'tramp', bumper: 'bumper',
    ball_beach: 'rubber', ball_marble: 'marble', berry: 'berry', magnet: 'magnet',
    balloon: 'balloon', balloon_goal: 'balloon', bell: 'bell', bowl: 'wood', spikes: 'wood',
    rope: 'wood', scissors: 'magnet', candle: 'wood', fuse: 'wood',
    hydrant: 'magnet', switch: 'wood', fist: 'bumper',
  };

  const FAN_REACH = 280;
  const FAN_HALF_WIDTH = 52;
  const CONVEYOR_SPEED = 3.2;
  const MAGNET_REACH = 340;
  const MAGNET_ACTIVE_FRAMES = 120; // ~2s pull, then it "gets tired" and releases
  const MAGNET_COOLDOWN_FRAMES = 30;
  const ROPE_LENGTH = 150;          // anchor to hanging point
  const ROPE_SNAP = 70;             // grab radius around the rope end at sim start
  const FUSE_BURN_FRAMES = 150;     // full fuse burns in ~2.5s
  const FLAME_R = 22;               // ignition/pop radius around a flame point
  const HYDRANT_REACH = 240;
  const HYDRANT_HALF_WIDTH = 46;
  const SWITCH_WIRE_REACH = 260;    // links to the nearest fan/conveyor/magnet
  const FIST_LAUNCH = 15;           // punch speed straight up (px/frame)
  const FIST_COOLDOWN = 60;

  let nextId = 1;

  // matter reports collision pairs on compound *part* bodies (bucket/bowl
  // walls), which carry no tag — resolve through the parent.
  function lab(body) {
    const l = body.plugin && body.plugin.lab;
    if (l) return l;
    const p = body.parent;
    return (p && p !== body && p.plugin && p.plugin.lab) || undefined;
  }

  function dirVector(dir) {
    if (dir === 'left') return { x: -1, y: 0 };
    if (dir === 'up') return { x: 0, y: -1 };
    return { x: 1, y: 0 };
  }

  // --- small geometry helpers for the machine-shop parts ---------------------
  function toLocal(body, p) {
    const c = Math.cos(-body.angle), s = Math.sin(-body.angle);
    const dx = p.x - body.position.x, dy = p.y - body.position.y;
    return { x: dx * c - dy * s, y: dx * s + dy * c };
  }
  function pointInOBB(body, p, hw, hh, pad) {
    const l = toLocal(body, p);
    return Math.abs(l.x) <= hw + (pad || 0) && Math.abs(l.y) <= hh + (pad || 0);
  }
  // segment vs oriented box (in the box's local frame, conservative sampling)
  function segIntersectsOBB(a, b, body, hw, hh, pad) {
    const steps = 12;
    for (let i = 0; i <= steps; i++) {
      const p = { x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps };
      if (pointInOBB(body, p, hw, hh, pad)) return true;
    }
    return false;
  }
  function distPointSeg(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * vx + (p.y - a.y) * vy) / (vx * vx + vy * vy || 1)));
    return Math.hypot(p.x - (a.x + vx * t), p.y - (a.y + vy * t));
  }
  // point on a fuse's long axis for parameter u in [0,1]
  function fusePoint(body, len, u) {
    const c = Math.cos(body.angle), s = Math.sin(body.angle);
    const lx = (u - 0.5) * len;
    return { x: body.position.x + lx * c, y: body.position.y + lx * s };
  }

  // Create the Matter body (or bodies) for one part instance.
  // Returns { bodies: [...], constraints: [...] } — all get plugin.lab metadata.
  function makePart(spec) {
    const def = PART_DEFS[spec.type];
    if (!def) throw new Error('Unknown part type: ' + spec.type);
    const x = spec.x, y = spec.y;
    const angle = (spec.angle || 0) * Math.PI / 180;
    const w = spec.w || def.w, h = spec.h || def.h;
    const meta = {
      id: 'p' + (nextId++), type: spec.type, dir: spec.dir || (def.dir ? def.dir[0] : null),
      w, h, r: def.r, placed: !!spec.placed, spec,
    };
    const bodies = [], constraints = [];
    const tag = (b, extra) => {
      b.plugin = b.plugin || {};
      b.plugin.lab = Object.assign({}, meta, extra || {});
      b.label = spec.type;
      return b;
    };

    switch (spec.type) {
      case 'plank': case 'shelf': case 'wall': case 'conveyor': case 'spikes':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, {
          isStatic: true, angle, friction: spec.type === 'conveyor' ? 0.9 : 0.4, restitution: 0.1,
        })));
        break;

      case 'trampoline':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.1, restitution: 0.4 })));
        break;

      case 'bumper':
        bodies.push(tag(Bodies.circle(x, y, def.r, { isStatic: true, restitution: 1.0, friction: 0 })));
        break;

      case 'fan':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.3, restitution: 0.1 })));
        break;

      case 'magnet':
        // Sleepy magnet: a bump wakes it up (see collisionStart), then it pulls
        // metal marbles for MAGNET_ACTIVE_FRAMES before releasing them.
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.4, restitution: 0.2 }),
          { magnet: { active: false, timer: 0, cooldown: 0 } }));
        break;

      case 'rope':
        // Anchor plate; at sim start the tether grabs the nearest dynamic body
        // near the rope's hanging end (see createSim). Cut by scissors/flame.
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.4, restitution: 0.1 }),
          { rope: { attached: null, cut: false, endY: y + ROPE_LENGTH } }));
        break;

      case 'scissors':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, angle, friction: 0.2, restitution: 0.1 }),
          { snips: 0 }));
        break;

      case 'candle':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.4, restitution: 0.1 }),
          { candle: { lit: true } }));
        break;

      case 'fuse':
        // Thin sensor strip: bodies pass through; only flames interact with it.
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, isSensor: true, angle }),
          { fuse: { active: false, ignited: false, dead: false, a: 0.5, b: 0.5, len: w } }));
        break;

      case 'hydrant':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.4, restitution: 0.2 })));
        break;

      case 'switch':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.6, restitution: 0 }),
          { sw: { pressed: 0, target: null } }));
        break;

      case 'fist':
        bodies.push(tag(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.4, restitution: 0.1 }),
          { fist: { cooldown: 0 } }));
        break;

      case 'domino':
        // friction 0.2 is load-bearing: chains propagate at ~34px spacing
        // (higher friction stalls the chain, lower slides instead of tipping).
        bodies.push(tag(Bodies.rectangle(x, y, w, h, {
          density: 0.002, friction: 0.2, frictionStatic: 0.5, restitution: 0.05,
        })));
        break;

      case 'seesaw': {
        const plank = tag(Bodies.rectangle(x, y, w, h, {
          density: 0.0008, friction: 0.5, restitution: 0.1, frictionAir: 0.008, chamfer: { radius: 4 },
        }));
        bodies.push(plank);
        constraints.push(Constraint.create({
          pointA: { x, y }, bodyB: plank, pointB: { x: 0, y: 0 }, length: 0, stiffness: 0.95,
        }));
        break;
      }

      case 'balloon': case 'balloon_goal': {
        const b = tag(Bodies.circle(x, y, def.r, {
          density: 0.0004, restitution: 0.5, friction: 0.05, frictionAir: 0.045,
        }), { buoyant: true, poppable: true, goalBalloon: spec.type === 'balloon_goal' });
        bodies.push(b);
        if (spec.type === 'balloon_goal') {
          // Tethered so goal balloons bob in place instead of floating away.
          constraints.push(Constraint.create({
            pointA: { x, y: y + 95 }, bodyB: b, pointB: { x: 0, y: 0 },
            length: 95, stiffness: 0.01, damping: 0.05,
          }));
          b.plugin.lab.tetherAnchor = { x, y: y + 95 };
        }
        break;
      }

      case 'bucket': case 'bowl': {
        const wallT = 14;
        const isBowl = spec.type === 'bowl';
        const height = isBowl ? 62 : h;
        const bottom = Bodies.rectangle(x, y + height / 2 - wallT / 2, w, wallT, {});
        const lw = Bodies.rectangle(x - w / 2 + wallT / 2, y, wallT, height, { angle: -0.12 });
        const rw = Bodies.rectangle(x + w / 2 - wallT / 2, y, wallT, height, { angle: 0.12 });
        const compound = Body.create({ parts: [bottom, lw, rw], isStatic: true, friction: 0.4, restitution: 0.05 });
        Body.setPosition(compound, { x, y });
        tag(compound, { height });
        bodies.push(compound);
        if (isBowl) {
          const sensor = Bodies.rectangle(x, y + 8, w - 2 * wallT - 6, height - 24, { isStatic: true, isSensor: true });
          tag(sensor, { sensor: 'bowl' });
          sensor.label = 'bowl_sensor';
          bodies.push(sensor);
        }
        break;
      }

      case 'bell':
        bodies.push(tag(Bodies.circle(x, y, def.r, { isStatic: true, restitution: 0.4, friction: 0.1 })));
        break;

      case 'sparkle': {
        const s = tag(Bodies.circle(x, y, def.r, { isStatic: true, isSensor: true }), { sensor: 'sparkle' });
        s.label = 'sparkle';
        bodies.push(s);
        break;
      }

      case 'berry':
        bodies.push(tag(Bodies.circle(x, y, def.r, {
          density: 0.0015, restitution: 0.3, friction: 0.08, frictionAir: 0.005,
        }), { isBerry: true }));
        break;

      case 'ball_beach':
        bodies.push(tag(Bodies.circle(x, y, def.r, {
          density: 0.0006, restitution: 0.72, friction: 0.03, frictionAir: 0.006,
        })));
        break;

      case 'ball_marble':
        bodies.push(tag(Bodies.circle(x, y, def.r, {
          density: 0.006, restitution: 0.12, friction: 0.02, frictionAir: 0.002,
        })));
        break;

      default:
        throw new Error('makePart: unhandled type ' + spec.type);
    }
    return { bodies, constraints };
  }

  // ---------------------------------------------------------------------------
  // Simulation
  // ---------------------------------------------------------------------------

  function createSim(levelDef, placements, opts) {
    opts = opts || {};
    const engine = Engine.create();
    engine.gravity.y = 1;
    engine.positionIterations = 8;
    engine.velocityIterations = 6;

    const state = {
      t: 0, frames: 0, won: false, settled: false,
      goalType: levelDef.goalType || 'catch',
      caughtFrames: 0, bellRung: false,
      balloonsLeft: 0, sparkles: 0, sparkleTotal: 0,
      events: [],   // drained by renderer/audio every frame
      quietFrames: 0,
    };

    const world = engine.world;
    const parts = []; // {spec, bodies, constraints, meta}

    function addSpec(spec) {
      const made = makePart(spec);
      Composite.add(world, made.bodies);
      if (made.constraints.length) Composite.add(world, made.constraints);
      parts.push({ spec, bodies: made.bodies, constraints: made.constraints });
      const m = lab(made.bodies[0]);
      if (m.goalBalloon) state.balloonsLeft++;
      if (spec.type === 'sparkle') state.sparkleTotal++;
      return made;
    }

    // Static world bounds: floor + side walls (ceiling open).
    const bounds = [
      Bodies.rectangle(WORLD.w / 2, WORLD.floorY + 40, WORLD.w + 400, 80, { isStatic: true, friction: 0.5 }),
      Bodies.rectangle(-40, WORLD.h / 2, 80, WORLD.h * 3, { isStatic: true }),
      Bodies.rectangle(WORLD.w + 40, WORLD.h / 2, 80, WORLD.h * 3, { isStatic: true }),
    ];
    bounds.forEach(b => { b.label = 'bounds'; b.plugin = { lab: { type: 'bounds', id: 'bounds' } }; });
    Composite.add(world, bounds);

    (levelDef.fixed || []).forEach(s => addSpec(s));
    (levelDef.sparkles || []).forEach(s => addSpec({ type: 'sparkle', x: s.x, y: s.y }));
    (placements || []).forEach(s => addSpec(Object.assign({ placed: true }, s)));

    const dynamicBodies = () => Composite.allBodies(world).filter(b => !b.isStatic);

    // --- machine-shop wiring (runs once, after all parts exist) --------------
    // Ropes grab the nearest dynamic body near their hanging end.
    for (const p of parts) {
      if (p.spec.type !== 'rope') continue;
      const anchor = p.bodies[0];
      const m = lab(anchor);
      const end = { x: anchor.position.x, y: anchor.position.y + ROPE_LENGTH };
      let best = null, bd = ROPE_SNAP;
      for (const b of dynamicBodies()) {
        const d = Math.hypot(b.position.x - end.x, b.position.y - end.y);
        if (d < bd) { bd = d; best = b; }
      }
      if (best) {
        const c = Constraint.create({
          pointA: { x: anchor.position.x, y: anchor.position.y + m.h / 2 },
          bodyB: best, pointB: { x: 0, y: 0 },
          length: ROPE_LENGTH - m.h / 2, stiffness: 0.9, damping: 0.05,
        });
        Composite.add(world, c);
        m.rope.attached = best;
        m.rope.constraint = c;
      }
    }
    // Switches wire themselves to the nearest fan/conveyor/magnet.
    for (const p of parts) {
      if (p.spec.type !== 'switch') continue;
      const swBody = p.bodies[0];
      let best = null, bd = SWITCH_WIRE_REACH;
      for (const q of parts) {
        if (!['fan', 'conveyor', 'magnet'].includes(q.spec.type)) continue;
        const d = Math.hypot(q.bodies[0].position.x - swBody.position.x, q.bodies[0].position.y - swBody.position.y);
        if (d < bd) { bd = d; best = q; }
      }
      if (best) {
        lab(swBody).sw.target = lab(best.bodies[0]).id;
        lab(best.bodies[0]).switchControlled = true;
      }
    }

    // --- collision handling -------------------------------------------------
    function popBalloon(b) {
      const m = lab(b);
      if (!m || m.popped) return;
      m.popped = true;
      state.events.push({ type: 'pop', x: b.position.x, y: b.position.y, goal: !!m.goalBalloon });
      if (m.goalBalloon) state.balloonsLeft--;
      const part = parts.find(p => p.bodies.includes(b));
      Composite.remove(world, b);
      if (part) part.constraints.forEach(c => Composite.remove(world, c));
    }

    Events.on(engine, 'collisionStart', (ev) => {
      for (const pair of ev.pairs) {
        const a = pair.bodyA, b = pair.bodyB;
        const la = lab(a), lb = lab(b);
        if (!la || !lb) continue;

        // Sparkle pickup — any dynamic body collects (balloons included:
        // in pop levels the balloon is the hero riding the sparkle path).
        for (const [s, o] of [[a, b], [b, a]]) {
          if (lab(s).sensor === 'sparkle' && !o.isStatic && !lab(s).collected) {
            lab(s).collected = true;
            state.sparkles++;
            state.events.push({ type: 'sparkle', x: s.position.x, y: s.position.y, n: state.sparkles });
            Composite.remove(world, s);
          }
        }

        const relSpeed = Math.hypot(
          a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);

        // Balloon popping: spikes always pop; goal balloons also pop from fast hits.
        for (const [x1, x2] of [[a, b], [b, a]]) {
          const m1 = lab(x1), m2 = lab(x2);
          if (m1.poppable && (m2.type === 'spikes' || (m1.goalBalloon && !x2.isSensor && relSpeed >= 3.5)))
            popBalloon(x1);
        }

        // Bell ring.
        for (const [bell, o] of [[a, b], [b, a]]) {
          if (lab(bell).type === 'bell' && !o.isSensor && relSpeed >= 1.8 && !state.bellRung) {
            state.bellRung = true;
            state.events.push({ type: 'bell', x: bell.position.x, y: bell.position.y });
          }
        }

        // Trampoline boost: reliable, satisfying vertical launch.
        for (const [tr, o] of [[a, b], [b, a]]) {
          if (lab(tr).type === 'trampoline' && !o.isStatic) {
            const vy = o.velocity.y;
            if (vy > 1.5 && o.position.y < tr.position.y) {
              Body.setVelocity(o, { x: o.velocity.x, y: -Math.max(vy * 1.06, 8) });
              state.events.push({ type: 'boing', x: o.position.x, y: tr.position.y, impact: vy, bodyId: o.id, partId: lab(tr).id });
            }
          }
        }

        // Magnet activation: any decent bump wakes a sleeping magnet
        // (and re-bumping an active one keeps it awake longer). Switch-wired
        // magnets ignore bumps — the switch decides.
        for (const [mg, o] of [[a, b], [b, a]]) {
          const mm = lab(mg).magnet;
          if (mm && !lab(mg).switchControlled && !o.isStatic && !o.isSensor && relSpeed >= 1.6 && mm.cooldown <= 0) {
            const wasOff = !mm.active;
            mm.active = true;
            mm.timer = MAGNET_ACTIVE_FRAMES;
            if (wasOff) state.events.push({ type: 'magnet_on', x: mg.position.x, y: mg.position.y });
          }
        }

        // Spring-loaded fist: punches whatever lands on it straight up.
        for (const [fb, o] of [[a, b], [b, a]]) {
          const fm = lab(fb).fist;
          if (fm && !o.isStatic && !o.isSensor && fm.cooldown <= 0
            && o.position.y < fb.position.y - 6 && relSpeed >= 1) {
            fm.cooldown = FIST_COOLDOWN;
            Body.setVelocity(o, { x: o.velocity.x, y: -FIST_LAUNCH });
            state.events.push({ type: 'thwack', x: fb.position.x, y: fb.position.y - 24, bodyId: o.id, partId: lab(fb).id });
          }
        }

        // Bumper ping event (physics handled by restitution).
        if ((la.type === 'bumper' || lb.type === 'bumper') && relSpeed > 1.5) {
          const bump = la.type === 'bumper' ? a : b;
          state.events.push({ type: 'bumper', x: bump.position.x, y: bump.position.y, impact: relSpeed, partId: lab(bump).id });
        }

        // Generic impact event for audio (skip sensors & tiny taps).
        if (!a.isSensor && !b.isSensor && relSpeed > 1.2) {
          const dyn = a.isStatic ? b : a;
          const other = a.isStatic ? a : b;
          state.events.push({
            type: 'hit', impact: relSpeed, bodyId: dyn.id,
            x: pair.collision.supports[0] ? pair.collision.supports[0].x : dyn.position.x,
            y: pair.collision.supports[0] ? pair.collision.supports[0].y : dyn.position.y,
            nx: pair.collision.normal.x, ny: pair.collision.normal.y,
            matA: MATERIAL[lab(dyn).type] || 'wood',
            matB: MATERIAL[lab(other).type] || 'wood',
          });
        }
      }
    });

    // Bowl catch detection via active sensor overlap.
    Events.on(engine, 'collisionActive', (ev) => {
      for (const pair of ev.pairs) {
        for (const [s, o] of [[pair.bodyA, pair.bodyB], [pair.bodyB, pair.bodyA]]) {
          const ls = lab(s);
          if (ls && ls.sensor === 'bowl' && lab(o) && lab(o).isBerry) {
            state.caughtFrames++;
          }
        }
      }
    });

    // --- machine-shop helpers -------------------------------------------------
    const rectContains = (r, p) => p.x >= r.min.x && p.x <= r.max.x && p.y >= r.min.y && p.y <= r.max.y;
    const flameTip = (body, h) => ({ x: body.position.x, y: body.position.y - h / 2 - 8 });
    function ropeEnds(p) {
      const anchor = p.bodies[0], m = lab(anchor);
      if (!m.rope.attached) return null;
      return [{ x: anchor.position.x, y: anchor.position.y + m.h / 2 }, m.rope.attached.position];
    }
    function cutRope(p, x, y, cause) {
      const m = lab(p.bodies[0]);
      if (m.rope.cut || !m.rope.attached) return;
      m.rope.cut = true;
      Composite.remove(world, m.rope.constraint);
      m.rope.attached = null;
      state.events.push({ type: 'snip', x, y, cause: cause || 'blade' });
    }
    function igniteFuse(fm, body, u) {
      if (fm.dead) return;
      if (!fm.ignited) {
        fm.ignited = true; fm.active = true; fm.a = u; fm.b = u;
        const pt = fusePoint(body, fm.len, u);
        state.events.push({ type: 'ignite', x: pt.x, y: pt.y });
      } else if (!fm.active && (u <= fm.a + 0.02 || u >= fm.b - 0.02)) {
        fm.active = true; // re-lit at an unburnt tip after being doused
        const pt = fusePoint(body, fm.len, u);
        state.events.push({ type: 'ignite', x: pt.x, y: pt.y });
      }
    }

    // --- per-frame forces -----------------------------------------------------
    function applyBehaviours() {
      const all = Composite.allBodies(world);

      // pressure switches first: devices read poweredNow below
      const pressedTargets = {};
      for (const p of parts) {
        if (p.spec.type !== 'switch') continue;
        const swb = p.bodies[0], m = lab(swb).sw;
        let pressed = false;
        for (const pair of engine.pairs.list) {
          if (!pair.isActive) continue;
          const other = pair.bodyA === swb ? pair.bodyB : pair.bodyB === swb ? pair.bodyA : null;
          if (other && !other.isStatic && !other.isSensor && other.position.y < swb.position.y) { pressed = true; break; }
        }
        if (pressed !== !!m.pressedState) {
          m.pressedState = pressed;
          state.events.push({ type: pressed ? 'switch_on' : 'switch_off', x: swb.position.x, y: swb.position.y });
        }
        if (pressed && m.target) pressedTargets[m.target] = true;
      }
      for (const p of parts) {
        const m0 = lab(p.bodies[0]);
        if (m0.switchControlled) m0.poweredNow = !!pressedTargets[m0.id];
      }

      for (const p of parts) {
        const spec = p.spec;
        if (spec.type === 'fan') {
          const fanBody = p.bodies[0];
          const m = lab(fanBody);
          if (m.switchControlled && !m.poweredNow) continue;
          const dv = dirVector(m.dir);
          const fx = fanBody.position.x, fy = fanBody.position.y;
          const cx = fx + dv.x * (28 + FAN_REACH / 2);
          const cy = fy + dv.y * (28 + FAN_REACH / 2);
          const hw = dv.x === 0 ? FAN_HALF_WIDTH : FAN_REACH / 2;
          const hh = dv.x === 0 ? FAN_REACH / 2 : FAN_HALF_WIDTH;
          const region = { min: { x: cx - hw, y: cy - hh }, max: { x: cx + hw, y: cy + hh } };
          for (const b of Query.region(all, region)) {
            // berries are immune to wind — a core teaching insight (level 12:
            // "wind can't move a berry, but a wind-blown beach ball can")
            if (b.isStatic || b.isSensor || (lab(b) && lab(b).isBerry)) continue;
            const dist = Math.abs(dv.x !== 0 ? b.position.x - fx : b.position.y - fy);
            const falloff = Math.max(0.35, 1 - dist / (FAN_REACH + 40));
            const heavy = b.density > 0.004;
            const mag = (heavy ? 0.00035 : 0.0019) * Math.min(b.mass, 2.4) * falloff;
            Body.applyForce(b, b.position, { x: dv.x * mag, y: dv.y * mag });
          }
        }
        if (spec.type === 'magnet') {
          const mg = p.bodies[0];
          const meta = lab(mg);
          const mm = meta.magnet;
          if (meta.switchControlled) {
            // wired to a pressure switch: powered = pulling, no timer/cooldown
            if (mm.active !== !!meta.poweredNow) {
              mm.active = !!meta.poweredNow;
              state.events.push({ type: mm.active ? 'magnet_on' : 'magnet_off', x: mg.position.x, y: mg.position.y });
            }
            mm.timer = 2;
          }
          if (mm.cooldown > 0) mm.cooldown--;
          if (mm.active) {
            if (!meta.switchControlled) mm.timer--;
            if (mm.timer <= 0) {
              mm.active = false;
              mm.cooldown = MAGNET_COOLDOWN_FRAMES;
              state.events.push({ type: 'magnet_off', x: mg.position.x, y: mg.position.y });
            } else {
              // Pull metal marbles toward the magnet; strong enough to lift
              // against gravity up close, gentle tug at the edge of its reach.
              for (const b of all) {
                if (b.isStatic || lab(b).type !== 'ball_marble') continue;
                const dx = mg.position.x - b.position.x, dy = mg.position.y - b.position.y;
                const dist = Math.hypot(dx, dy);
                if (dist > MAGNET_REACH || dist < 1) continue;
                const ux = dx / dist, uy = dy / dist;
                const approach = b.velocity.x * ux + b.velocity.y * uy;
                if (approach > 9) continue; // speed cap: no slingshots
                const strength = dist < 150 ? 0.0026 : 0.0026 - (dist - 150) * 0.0000074;
                Body.applyForce(b, b.position, { x: ux * strength * b.mass, y: uy * strength * b.mass });
              }
            }
          }
        }
        if (spec.type === 'balloon' || spec.type === 'balloon_goal') {
          const b = p.bodies[0];
          const m = lab(b);
          if (!m.popped) {
            // Net upward: buoyancy 1.65x gravity; frictionAir caps rise speed.
            Body.applyForce(b, b.position, { x: 0, y: -b.mass * engine.gravity.y * 0.001 * 1.65 });
          }
        }
      }

      // Conveyor surface drive: steer contacting bodies toward belt speed.
      const pairs = engine.pairs.list;
      for (const pair of pairs) {
        if (!pair.isActive) continue;
        const la = lab(pair.bodyA), lb = lab(pair.bodyB);
        for (const [belt, o] of [[la, pair.bodyB], [lb, pair.bodyA]]) {
          if (belt && belt.type === 'conveyor' && !o.isStatic
            && !(belt.switchControlled && !belt.poweredNow)) {
            const target = (belt.dir === 'left' ? -1 : 1) * CONVEYOR_SPEED;
            const dvx = target - o.velocity.x;
            Body.setVelocity(o, { x: o.velocity.x + Math.max(-0.4, Math.min(0.4, dvx)), y: o.velocity.y });
            Body.setAngularVelocity(o, o.angularVelocity * 0.9);
          }
        }
      }

      // --- machine shop: water, fire, blades, fists ---------------------------
      // Hydrant jets: push EVERYTHING (water is strong — even berries, unlike
      // fans) and douse any flame they reach.
      for (const p of parts) {
        if (p.spec.type !== 'hydrant') continue;
        const hb = p.bodies[0], m = lab(hb);
        const dv = dirVector(m.dir);
        const hx = hb.position.x, hy = hb.position.y;
        const cx = hx + dv.x * (30 + HYDRANT_REACH / 2), cy = hy + dv.y * (34 + HYDRANT_REACH / 2);
        const hw = dv.x === 0 ? HYDRANT_HALF_WIDTH : HYDRANT_REACH / 2;
        const hh = dv.x === 0 ? HYDRANT_REACH / 2 : HYDRANT_HALF_WIDTH;
        const region = { min: { x: cx - hw, y: cy - hh }, max: { x: cx + hw, y: cy + hh } };
        for (const b of Query.region(all, region)) {
          if (b.isStatic || b.isSensor) continue;
          const dist = Math.abs(dv.x !== 0 ? b.position.x - hx : b.position.y - hy);
          const falloff = Math.max(0.4, 1 - dist / (HYDRANT_REACH + 40));
          const heavy = b.density > 0.004;
          const mag = (heavy ? 0.0011 : 0.0032) * Math.min(b.mass, 3) * falloff;
          Body.applyForce(b, b.position, { x: dv.x * mag, y: dv.y * mag });
        }
        for (const q of parts) {
          if (q.spec.type === 'candle') {
            const cm = lab(q.bodies[0]).candle;
            const tip = flameTip(q.bodies[0], lab(q.bodies[0]).h);
            if (cm.lit && rectContains(region, tip)) {
              cm.lit = false;
              state.events.push({ type: 'extinguish', x: tip.x, y: tip.y });
            }
          } else if (q.spec.type === 'fuse') {
            const fm = lab(q.bodies[0]).fuse;
            if (!fm.active) continue;
            for (const u of [fm.a > 0 ? fm.a : null, fm.b < 1 ? fm.b : null]) {
              if (u == null) continue;
              const pt = fusePoint(q.bodies[0], fm.len, u);
              if (rectContains(region, pt)) {
                fm.active = false;
                state.events.push({ type: 'extinguish', x: pt.x, y: pt.y });
                break;
              }
            }
          }
        }
      }

      // Advance burning fuses (the burnt interval [a,b] grows both ways).
      const burnRate = 1 / FUSE_BURN_FRAMES;
      for (const p of parts) {
        if (p.spec.type !== 'fuse') continue;
        const fm = lab(p.bodies[0]).fuse;
        if (!fm.active) continue;
        fm.a = Math.max(0, fm.a - burnRate);
        fm.b = Math.min(1, fm.b + burnRate);
        if (fm.a <= 0 && fm.b >= 1) { fm.active = false; fm.dead = true; }
      }

      // Collect live flame points: lit candles + burning fuse fronts.
      const flames = [];
      for (const p of parts) {
        if (p.spec.type === 'candle' && lab(p.bodies[0]).candle.lit) {
          flames.push(flameTip(p.bodies[0], lab(p.bodies[0]).h));
        } else if (p.spec.type === 'fuse') {
          const fm = lab(p.bodies[0]).fuse;
          if (!fm.active) continue;
          if (fm.a > 0) flames.push(fusePoint(p.bodies[0], fm.len, fm.a));
          if (fm.b < 1) flames.push(fusePoint(p.bodies[0], fm.len, fm.b));
        }
      }
      // Flames act on the world: pop balloons, light fuses/candles, burn ropes.
      for (const f of flames) {
        for (const b of all) {
          const mb = lab(b);
          if (mb && mb.poppable && !mb.popped
            && Math.hypot(b.position.x - f.x, b.position.y - f.y) < FLAME_R + (mb.r || 20)) popBalloon(b);
        }
        for (const q of parts) {
          if (q.spec.type === 'fuse') {
            const qb = q.bodies[0], fm = lab(qb).fuse;
            if (fm.dead) continue;
            const l = toLocal(qb, f);
            if (Math.abs(l.y) <= lab(qb).h / 2 + 10 && Math.abs(l.x) <= fm.len / 2 + 6) {
              igniteFuse(fm, qb, Math.max(0, Math.min(1, (l.x + fm.len / 2) / fm.len)));
            }
          } else if (q.spec.type === 'candle') {
            const cm = lab(q.bodies[0]).candle;
            const tip = flameTip(q.bodies[0], lab(q.bodies[0]).h);
            if (!cm.lit && Math.hypot(tip.x - f.x, tip.y - f.y) < FLAME_R * 1.3) {
              cm.lit = true;
              state.events.push({ type: 'ignite', x: tip.x, y: tip.y });
            }
          } else if (q.spec.type === 'rope') {
            const ends = ropeEnds(q);
            if (ends && distPointSeg(f, ends[0], ends[1]) < 14) cutRope(q, f.x, f.y, 'fire');
          }
        }
      }

      // Scissors cut any rope whose line crosses their blades.
      for (const p of parts) {
        if (p.spec.type !== 'scissors') continue;
        const sb = p.bodies[0], sm = lab(sb);
        for (const q of parts) {
          if (q.spec.type !== 'rope') continue;
          const ends = ropeEnds(q);
          if (ends && segIntersectsOBB(ends[0], ends[1], sb, sm.w / 2, sm.h / 2, 2)) {
            sm.snips = (sm.snips || 0) + 1;

            if (coll && coll.collided && coll.depth > 2) { overlaps = true; break; }
          }
          if (overlaps) break;
        }
        if (overlaps) break;
      }
      if (overlaps) break;
    }
    return overlaps;
  }

  return { PART_DEFS, MATERIAL, WORLD, makePart, createSim, simulate, placementOverlaps, Matter };

(function () {
  'use strict';

  var ctx = null, sfxBus = null, musicBus = null, noiseBuf = null;
  var sfxOn = true, musicOn = true;

  var MUSIC_LEVEL = 0.126;
  var MIN_GAP = { wood: 0.03, dominoTick: 0.03, marble: 0.025 }; // per-name rate limits (s)
  var LOW_PRI = { dominoTick: true, marble: true };              // dropped first at voice cap

  function noop() {}
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }

  // ---- context / graph (spec §3): master 0.9 -> compressor -> destination ----
  function init() {
    var AC = typeof AudioContext !== 'undefined' ? AudioContext

    if (!AC) return false;

    comp.threshold.value = -12; comp.knee.value = 20; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    comp.connect(ctx.destination);
    var master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1.0; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_LEVEL; musicBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); // shared 1 s white noise
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', function () {
        if (!ctx) return;
        var p = document.hidden ? ctx.suspend() : ctx.resume();
        if (p && p.catch) p.catch(noop);
      });
    }
    return true;
  }

  function noise(loop) { var s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = !!loop; return s; }
  function filt(type, f, q) { var b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; }
  function gainNode(v) { var g = ctx.createGain(); g.gain.value = v; return g; }
  function chain() { for (var i = 0; i < arguments.length - 1; i++) arguments[i].connect(arguments[i + 1]); }
  function sweep(p, t0, v0, t1, v1, expo) { // anchor at v0, ramp (exp/linear) to v1
    p.setValueAtTime(v0, t0);
    p[expo ? 'exponentialRampToValueAtTime' : 'linearRampToValueAtTime'](v1, t1);
  }
  function env(p, t, a, peak, d) { // linear attack, exponential decay to 0.001 (never 0)
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(Math.max(peak, 0.0011), t + a);
    p.exponentialRampToValueAtTime(0.001, t + a + d);
  }
  function holdEnv(p, t, a, lvl, holdEnd, rel) { // attack, sustain, exp release
    p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(lvl, t + a);
    p.setValueAtTime(lvl, holdEnd); p.exponentialRampToValueAtTime(0.001, holdEnd + rel);
  }
  function lfoTo(t, type, f, depth, target, stopAt) { // osc -> depth gain -> AudioParam
    var o = osc(type, f, t), g = gainNode(depth);
    chain(o, g, target); o.start(t); if (stopAt) o.stop(stopAt);
    return [o, g];
  }
  function fadeOut(p, t, dur) {
    p.cancelScheduledValues(t);
    p.setValueAtTime(Math.max(p.value, 0.0011), t);
    p.exponentialRampToValueAtTime(0.001, t + dur);
  }
  function shot(main, stopAt, nodes) { // one counted voice; onended frees the patch
    voiceCount++;
    main.onended = function () {
      voiceCount = Math.max(0, voiceCount - 1);
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
    main.stop(stopAt);
  }
  function tone(t, type, f, dur, peak, a, det) { // osc -> env gain -> sfxBus
    var o = osc(type, f, t); if (det) o.detune.value = det;
    var g = gainNode(0); env(g.gain, t, a, peak, dur);
    chain(o, g, sfxBus); o.start(t);
    return { o: o, nodes: [o, g] };
  }
  function noiseHit(t, dur, type, f, q, peak) { // self-stopping filtered noise burst
    var n = noise(false), fl = filt(type, f, q), g = gainNode(0);
    env(g.gain, t, 0.0005, peak, dur);
    chain(n, fl, g, sfxBus); n.start(t); n.stop(t + dur + 0.02);
    return [n, fl, g];
  }

  // ---- SFX recipes (spec §1); every trigger is detuned so no two are identical --
  var RECIPES = {
    wood: function (t, v) { // 1.1 sine body + 2.7x overtone + contact click
      var f0 = (160 + 170 * v) * rnd(0.97, 1.03), peak = 0.25 + 0.45 * v;
      var body = tone(t, 'sine', f0, 0.08, peak, 0.001, rnd(-35, 35));
      body.o.frequency.exponentialRampToValueAtTime(f0 * 0.5, t + 0.06);
      var over = tone(t, 'sine', f0 * 2.7, 0.04, peak * 0.25, 0.001); over.o.stop(t + 0.06);
      shot(body.o, t + 0.11, body.nodes.concat(over.nodes, noiseHit(t, 0.015, 'bandpass', 1200, 1, 0.12 * v)));
    },
    marble: function (t, v) { // 1.2 2.8 kHz ping + bright clack
      var ping = tone(t, 'sine', 2800, 0.045, 0.3 * v, 0.0005, rnd(-25, 25));
      shot(ping.o, t + 0.06, ping.nodes.concat(noiseHit(t, 0.04, 'bandpass', 4500 * rnd(0.9, 1.1), 8, 0.35 * v)));
    },
    rubber: function (t, v) { // 1.3 boing: triangle bend down + decaying 18 Hz wobble
      var f0 = 220 * (0.8 + 0.4 * v);
      var o = osc('triangle', f0, t); o.detune.value = rnd(-25, 25);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.7, t + 0.2);
      var lp = filt('lowpass', 900, 0.7), g = gainNode(0); env(g.gain, t, 0.003, 0.2 + 0.4 * v, 0.25);
      var wob = lfoTo(t, 'sine', 18, 15, o.frequency, t + 0.25);
      sweep(wob[1].gain, t, 15, t + 0.2, 0.001, true); // wobble depth decays to 0
      chain(o, lp, g, sfxBus); o.start(t);
      shot(o, t + 0.28, [o, lp, g].concat(wob));
    },
    tramp: function (t, v) { // 1.4 BOING: saw pitch bend up + quacky lowpass sweep
      var dur = 0.22 + 0.12 * v, dec = 0.3 + 0.1 * v;
      var o = osc('sawtooth', 140 + 40 * v, t); o.detune.value = rnd(-20, 20);
      o.frequency.exponentialRampToValueAtTime(320 + 220 * v, t + dur);
      var lp = filt('lowpass', 500, 2), g = gainNode(0);
      sweep(lp.frequency, t, 500, t + dur, 2500, true); env(g.gain, t, 0.005, 0.3 + 0.4 * v, dec);
      chain(o, lp, g, sfxBus); o.start(t);
      shot(o, t + dec + 0.03, [o, lp, g]);
    },
    dominoTick: function (t) { // 1.5 alternating 700/560 Hz tick, fixed gain
      dominoFlip = !dominoFlip;
      var b = tone(t, 'sine', dominoFlip ? 700 : 560, 0.03, 0.2, 0.0005, rnd(-40, 40));
      shot(b.o, t + 0.04, b.nodes.concat(noiseHit(t, 0.02, 'bandpass', 2000, 6, 0.15)));
    },
    bumper: function (t, v) { // 1.8 root + fifth ping, 5% spring-settle bend
      var fa = 880 * (1 + 0.15 * v), g0 = 0.35 + 0.3 * v, det = rnd(-15, 15);
      var a = tone(t, 'sine', fa, 0.2, g0, 0.001, det);
      a.o.frequency.exponentialRampToValueAtTime(fa * 0.95, t + 0.03);
      var b = tone(t, 'sine', fa * 1.5, 0.12, g0 * 0.5, 0.001, det);
      b.o.frequency.exponentialRampToValueAtTime(fa * 1.5 * 0.95, t + 0.03); b.o.stop(t + 0.14);
      shot(a.o, t + 0.23, a.nodes.concat(b.nodes, noiseHit(t, 0.008, 'highpass', 2000, null, 0.2)));
    },
    pop: function (t) { // 1.10 bang + swept air flap + 120 Hz thump
      var n1 = noise(false), hp = filt('highpass', 200), g1 = gainNode(0);
      sweep(g1.gain, t, 0.9, t + 0.07, 0.001, true); // A=0 bang
      chain(n1, hp, g1, sfxBus); n1.start(t); n1.stop(t + 0.08);
      var n2 = noise(false), bp = filt('bandpass', 3000, 2), g2 = gainNode(0);
      sweep(bp.frequency, t, 3000, t + 0.1, 500, true); env(g2.gain, t, 0.001, 0.3, 0.1);
      chain(n2, bp, g2, sfxBus); n2.start(t);
      var th = tone(t, 'sine', 120, 0.06, 0.4, 0.001); th.o.stop(t + 0.08);
      shot(n2, t + 0.12, [n1, hp, g1, n2, bp, g2].concat(th.nodes));
    },
    catch: function (t) { // 1.11 gulp dip/rise + delayed random C-major chime pair
      var o = osc('sine', 220, t); o.detune.value = rnd(-30, 30);
      o.frequency.linearRampToValueAtTime(150, t + 0.04);
      o.frequency.exponentialRampToValueAtTime(600, t + 0.14);
      var lp = filt('lowpass', 1200), g = gainNode(0); env(g.gain, t, 0.002, 0.35, 0.16);
      chain(o, lp, g, sfxBus); o.start(t); o.stop(t + 0.18);
      var tones = [1046.5, 1318.5, 1568, 2093], tc = t + 0.12;
      var i1 = (Math.random() * 4) | 0, i2 = (i1 + 1 + ((Math.random() * 3) | 0)) % 4; // two distinct
      var c1 = tone(tc, 'sine', tones[i1], 0.3, 0.12, 0.001); c1.o.stop(tc + 0.32);
      var c2 = tone(tc, 'sine', tones[i2], 0.3, 0.12, 0.001);
      shot(c2.o, tc + 0.33, [o, lp, g].concat(c1.nodes, c2.nodes));
    },
    bell: function (t) { // 1.12 FM strike; half-depth music duck (spec §2)
      var det = rnd(-10, 10), car = osc('sine', 880, t), mod = osc('sine', 1232, t);
      car.detune.value = det; mod.detune.value = det;
      var idx = gainNode(0); sweep(idx.gain, t, 600, t + 0.8, 1, true); // FM index decay
      chain(mod, idx, car.frequency);
      var g = gainNode(0); env(g.gain, t, 0.002, 0.4, 1.2);
      chain(car, g, sfxBus);
      var strike = tone(t, 'sine', 1760, 0.15, 0.15, 0.001, det); strike.o.stop(t + 0.17);
      car.start(t); mod.start(t); mod.stop(t + 1.22);
      shot(car, t + 1.25, [car, mod, idx, g].concat(strike.nodes));
      duck(0.063, t);
    },
    sparkle: function (t, v, opts) { // 1.13 C6/E6/G6 gliss x tier {1, 1.26, 1.5}
      var mult = [1, 1.26, 1.5][clamp((opts.tier || 0) | 0, 0, 2)];
      var notes = [1046.5, 1318.5, 1568], all = [], last = null;
      for (var i = 0; i < 3; i++) {
        var nt = tone(t + i * 0.045, 'sine', notes[i] * mult, 0.25, 0.22, 0.002, rnd(-8, 8));
        all = all.concat(nt.nodes);
        if (i < 2) nt.o.stop(t + i * 0.045 + 0.27); else last = nt.o;
      }
      shot(last, t + 0.37, all.concat(noiseHit(t, 0.08, 'highpass', 6000, null, 0.08)));
    },
    pickup: function (t) { uiThock(t, 330, 392); }, // 1.14 up-glide = grabbed
    place: function (t) { uiThock(t, 392, 330); },  // 1.14 down-glide = placed
    rotate: function (t) { // 1.15 tiny click
      var r = rnd(0.95, 1.05), b = tone(t, 'sine', 1200 * r, 0.025, 0.12, 0.0005);
      shot(b.o, t + 0.03, b.nodes.concat(noiseHit(t, 0.003, 'bandpass', 3000 * r, 3, 0.18)));
    },
    invalid: function (t) { // 1.16 gentle "uh-uh": two soft notes, wobble on 2nd
      var n1 = wobbleNote(t, 233, false); n1.main.stop(t + 0.13);
      var n2 = wobbleNote(t + 0.16, 208, true);
      shot(n2.main, t + 0.29, n1.nodes.concat(n2.nodes));
    },
    play: function (t) { // 1.17 slide whistle + breath noise tracking 2x pitch
      var o = osc('sine', 600, t), lp = filt('lowpass', 3000), g = gainNode(0);
      o.frequency.exponentialRampToValueAtTime(1200, t + 0.3);
      holdEnv(g.gain, t, 0.01, 0.3, t + 0.45, 0.12);
      chain(o, lp, g, sfxBus); o.start(t);
      var vib = lfoTo(t + 0.3, 'sine', 6, 25, o.frequency, t + 0.45); // vibrato on the hold
      var n = noise(false), bp = filt('bandpass', 1200, 4), gn = gainNode(0);
      sweep(bp.frequency, t, 1200, t + 0.3, 2400, true); holdEnv(gn.gain, t, 0.01, 0.05, t + 0.45, 0.12);
      chain(n, bp, gn, sfxBus); n.start(t); n.stop(t + 0.58);
      shot(o, t + 0.6, [o, lp, g, n, bp, gn].concat(vib));
    },
    win: function (t) { // 1.18 fanfare ~2 s; full music duck (spec §2)
      duck(0.032, t);
      var all = [], main = null, mainEnd = 0, i, r;
      var arp = [[0, 523.25], [0.15, 659.25], [0.3, 783.99], [0.45, 1046.5]], chord = [1046.5, 1318.5, 1568];
      for (i = 0; i < 4; i++) { r = fanfareNote(t + arp[i][0], arp[i][1], 0); r.main.stop(r.end); all = all.concat(r.nodes); }
      for (i = 0; i < 3; i++) { // held chord, released to end at ~2.0 s
        r = fanfareNote(t + 0.7, chord[i], t + 1.1);
        if (i < 2) r.main.stop(r.end); else { main = r.main; mainEnd = r.end; }
        all = all.concat(r.nodes);
      }
      var CMAJ = [2093, 2349.3, 2637, 2793.8, 3136, 3520, 3951.1, 4186, 4698.6];
      for (var tt = t + 0.5; tt < t + 1.8; tt += rnd(0.08, 0.14)) { // confetti pings
        var f = rnd(2000, 5000), best = CMAJ[0];
        for (i = 1; i < CMAJ.length; i++) if (Math.abs(CMAJ[i] - f) < Math.abs(best - f)) best = CMAJ[i];
        var p = tone(tt, 'sine', best, 0.15, 0.08, 0.001); p.o.stop(tt + 0.17);
        all = all.concat(p.nodes);
      }
      var n = noise(true), hp = filt('highpass', 5000), gn = gainNode(0); // shimmer swell
      holdEnv(gn.gain, t + 0.5, 0.3, 0.06, t + 0.8, 0.8);
      chain(n, hp, gn, sfxBus); n.start(t + 0.5); n.stop(t + 1.65);
      shot(main, mainEnd, all.concat([n, hp, gn]));
    },
    lose: function (t) { // 1.19 curious rising "hmm?" + soft "try again" chime
      var o = osc('triangle', 262, t), lp = filt('lowpass', 700), g = gainNode(0);
      sweep(o.frequency, t + 0.25, 262, t + 0.45, 294, false); // glide UP: a question
      env(g.gain, t, 0.03, 0.2, 0.45);
      chain(o, lp, g, sfxBus); o.start(t); o.stop(t + 0.5);
      var vib = lfoTo(t, 'sine', 5, 6, o.frequency, t + 0.5);
      var c = tone(t + 0.5, 'sine', 784, 0.25, 0.08, 0.002);
      shot(c.o, t + 0.78, [o, lp, g].concat(vib, c.nodes));
    },
    button: function (t) { // 1.20 tap
      var b = tone(t, 'sine', 600, 0.04, 0.25, 0.001, rnd(-20, 20));
      b.o.frequency.linearRampToValueAtTime(400, t + 0.03);
      shot(b.o, t + 0.05, b.nodes);
    },
    levelpop: function (t) { // 1.21 "bloop up" + tiny bright noise
      var r = rnd(0.95, 1.05), b = tone(t, 'sine', 300 * r, 0.08, 0.3, 0.002);
      b.o.frequency.exponentialRampToValueAtTime(900 * r, t + 0.06);
      shot(b.o, t + 0.09, b.nodes.concat(noiseHit(t, 0.005, 'highpass', 3000, null, 0.08)));
    },
    snip: function (t) { // scissors: two quick metallic clicks
      for (var i = 0; i < 2; i++) {
        var tt = t + i * 0.07;
        var b = tone(tt, 'sine', 2400 + i * 500, 0.035, 0.22, 0.001, rnd(-25, 25));
        shot(b.o, tt + 0.05, b.nodes.concat(noiseHit(tt, 0.012, 'bandpass', 5000, 7, 0.18)));
      }
    },
    thwack: function (t) { // spring fist: deep punch + spring twang
      var body = tone(t, 'sine', 130, 0.09, 0.5, 0.001, rnd(-20, 20));
      body.o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
      var tw = tone(t + 0.02, 'triangle', 620, 0.18, 0.18, 0.002, rnd(-30, 30));
      tw.o.frequency.exponentialRampToValueAtTime(280, t + 0.2);
      shot(body.o, t + 0.12, body.nodes.concat(noiseHit(t, 0.02, 'lowpass', 900, null, 0.4)));
      shot(tw.o, t + 0.22, tw.nodes);
    },
    switchOn: function (t) { // pressure plate down: firm click + rising blip
      var b = tone(t, 'sine', 500, 0.05, 0.3, 0.001);
      b.o.frequency.linearRampToValueAtTime(760, t + 0.04);
      shot(b.o, t + 0.06, b.nodes.concat(noiseHit(t, 0.008, 'bandpass', 2500, 4, 0.15)));
    },
    switchOff: function (t) { // plate up: softer falling blip
      var b = tone(t, 'sine', 640, 0.05, 0.2, 0.001);
      b.o.frequency.linearRampToValueAtTime(420, t + 0.045);
      shot(b.o, t + 0.06, b.nodes);
    },
    igniteFizz: function (t) { // fuse/candle catches: short sizzle + spark ping
      var n = noiseHit(t, 0.16, 'bandpass', 4200, 2.5, 0.22);
      var b = tone(t + 0.02, 'sine', 1800, 0.04, 0.12, 0.001, rnd(-40, 40));
      shot(b.o, t + 0.07, b.nodes.concat(n));
    },
    extinguishHiss: function (t) { // water meets flame: steam psshh
      var n = noiseHit(t, 0.3, 'bandpass', 2200, 1.2, 0.3);
      var n2 = noiseHit(t + 0.05, 0.22, 'highpass', 4500, null, 0.12);
      void n; void n2;
    },
    clank: function (t, v) { // magnet metal CLANK (hit with impact > 3)
      var body = tone(t, 'sine', 1900, 0.06, 0.35 * v, 0.001, rnd(-15, 15));
      shot(body.o, t + 0.09, body.nodes.concat(noiseHit(t, 0.025, 'bandpass', 3500, 6, 0.3 * v)));
    },
    magnetClunk: function (t) { // magnet_on engage
      var body = tone(t, 'square', 90, 0.08, 0.4, 0.001, rnd(-20, 20));
      shot(body.o, t + 0.1, body.nodes.concat(noiseHit(t, 0.03, 'lowpass', 800, null, 0.5)));
    },
    magnetWind: function (t) { // magnet_off wind-down: saw 180 -> 60 Hz
      var o = osc('sawtooth', 180, t), lp = filt('lowpass', 400), g = gainNode(0);
      o.frequency.exponentialRampToValueAtTime(60, t + 0.3); env(g.gain, t, 0.005, 0.15, 0.3);
      chain(o, lp, g, sfxBus); o.start(t);
      shot(o, t + 0.33, [o, lp, g]);
    }
  };

  function uiThock(t, f1, f2) { // 1.14 gliding sine body + noise thock
    var body = tone(t, 'sine', f1, 0.05, 0.3, 0.001, rnd(-15, 15));
    body.o.frequency.linearRampToValueAtTime(f2, t + 0.06);
    shot(body.o, t + 0.08, body.nodes.concat(noiseHit(t, 0.005, 'lowpass', 1000, null, 0.2)));
  }
  function wobbleNote(t, f, wobble) { // 1.16 soft triangle note with 3% pitch sag
    var o = osc('triangle', f, t), lp = filt('lowpass', 800), g = gainNode(0);
    o.frequency.linearRampToValueAtTime(f * 0.97, t + 0.12); env(g.gain, t, 0.01, 0.18, 0.11);
    chain(o, lp, g, sfxBus); o.start(t);
    var nodes = [o, lp, g];
    if (wobble) nodes = nodes.concat(lfoTo(t, 'sine', 8, 10, o.frequency, t + 0.13));
    return { main: o, nodes: nodes };
  }
  function fanfareNote(t, f, holdUntil) { // 1.18 triangle + octave sine at 0.4x
    var o1 = osc('triangle', f, t), o2 = osc('sine', f * 2, t);
    var g2 = gainNode(0.4), lp = filt('lowpass', 2500), g = gainNode(0), end;
    if (holdUntil) { // attack, settle to sustain 0.25, hold, 900 ms release
      sweep(g.gain, t, 0.0001, t + 0.005, 0.35, false);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.2);
      g.gain.setValueAtTime(0.25, holdUntil);
      g.gain.exponentialRampToValueAtTime(0.001, holdUntil + 0.9);
      end = holdUntil + 0.92;
    } else { env(g.gain, t, 0.005, 0.35, 0.5); end = t + 0.53; }
    chain(o1, lp); chain(o2, g2, lp, g, sfxBus);
    o1.start(t); o2.start(t); o2.stop(end);
    return { main: o1, end: end, nodes: [o1, o2, g2, lp, g] };
  }

  // ---- sfx dispatch: rate limits + voice cap 16 (low-priority skipped first) ----
  function sfx(name, opts) {
    if (!ctx || !sfxOn) return;
    var fn = RECIPES[name];
    if (!fn) return;
    var t = ctx.currentTime, gap = MIN_GAP[name];
    if (gap && t - (lastAt[name] || -1) < gap) return;
    if (voiceCount >= 16 && LOW_PRI[name]) return;
    if (voiceCount >= 24) return; // hard ceiling for everything else
    lastAt[name] = t;
    fn(t, clamp(opts && opts.strength != null ? opts.strength : 0.7, 0, 1), opts || {});
  }

  // ---- loops (1.6 fan, 1.7 conveyor, magnet hum, 1.9 balloon), refcounted ------
  function endLoop(level, fade, sources, nodes) { // fade out, stop sources, free all
    var t = ctx.currentTime;
    fadeOut(level.gain, t, fade);
    sources[0].onended = function () {
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
    for (var i = 0; i < sources.length; i++) { try { sources[i].stop(t + fade + 0.05); } catch (e) {} }
    return t;
  }
  function makeFan() { // 1.6 swept lowpass noise, 0.9 Hz cutoff LFO, 5.5 Hz blade whup
    var t = ctx.currentTime;
    var src = noise(true), lp = filt('lowpass', 200, 0.5), amp = gainNode(0.85), level = gainNode(0);
    sweep(lp.frequency, t, 200, t + 0.4, 650, false);   // spin-up
    sweep(level.gain, t, 0.0001, t + 0.4, 0.18, false);
    var ln = lfoTo(t, 'sine', 0.9, 150, lp.frequency, 0)  // cutoff +/-150 Hz
      .concat(lfoTo(t, 'sine', 5.5, 0.15, amp.gain, 0));  // whup: 0.7..1.0 of level
    chain(src, lp, amp, level, sfxBus); src.start(t);
    var nodes = [src, lp, amp, level].concat(ln);
    return { stop: function () { // 600 ms spin-down, cutoff back to 200
      var t2 = endLoop(level, 0.6, [src, ln[0], ln[2]], nodes);
      lp.frequency.cancelScheduledValues(t2);
      sweep(lp.frequency, t2, lp.frequency.value, t2 + 0.6, 200, false);
    } };
  }
  function makeConveyor() { // 1.7 55/55.6 Hz motor throb + belt ticks gated 0..0.05
    var t = ctx.currentTime;
    var o1 = osc('sawtooth', 55, t), o2 = osc('sawtooth', 55.6, t);
    var hlp = filt('lowpass', 300), hg = gainNode(0.10);
    var n = noise(true), bp = filt('bandpass', 900, 4), gate = gainNode(0.025);
    var gl = lfoTo(t, 'square', 3.2, 0.025, gate.gain, 0);
    var mix = gainNode(1), level = gainNode(0);
    chain(o1, hlp); chain(o2, hlp, hg, mix); chain(n, bp, gate, mix, level, sfxBus);
    sweep(level.gain, t, 0.0001, t + 0.2, 1, false); // 200 ms ramp in
    o1.start(t); o2.start(t); n.start(t);
    var nodes = [o1, o2, hlp, hg, n, bp, gate, mix, level].concat(gl);
    return { // n conveyors -> one instance at level 0.10*sqrt(n), capped at 1 overall
      setCount: function (c) { level.gain.setTargetAtTime(Math.min(10, Math.sqrt(c)), ctx.currentTime, 0.05); },
      stop: function () { endLoop(level, 0.2, [o1, o2, n, gl[0]], nodes); }
    };
  }
  function makeMagnet() { // hum: 70/70.7 Hz saws -> lowpass 250, 4 Hz AM depth 25%
    var t = ctx.currentTime;
    var o1 = osc('sawtooth', 70, t), o2 = osc('sawtooth', 70.7, t);
    var lp = filt('lowpass', 250), amp = gainNode(0.875), level = gainNode(0);
    var am = lfoTo(t, 'sine', 4, 0.125, amp.gain, 0);
    sweep(level.gain, t, 0.0001, t + 0.15, 0.12, false); // 150 ms ramp in
    chain(o1, lp); chain(o2, lp, amp, level, sfxBus);
    o1.start(t); o2.start(t);
    var nodes = [o1, o2, lp, amp, level].concat(am);
    return { stop: function () { endLoop(level, 0.15, [o1, o2, am[0]], nodes); } };
  }
  function makeBalloon() { // 1.9 squeak: pitch jitter + stutter bursts, level 0.06
    var t = ctx.currentTime;
    var o = osc('sawtooth', 300, t), bp = filt('bandpass', 600, 5);
    var stut = gainNode(0.5), level = gainNode(0);
    var ls = lfoTo(t, 'sine', 8, 20, o.detune, 0)                    // +/-20 cent jitter
      .concat(lfoTo(t, 'square', rnd(2.5, 3.5), 0.5, stut.gain, 0)); // bursts 0..1
    sweep(level.gain, t, 0.0001, t + 0.08, 0.06, false);
    chain(o, bp, stut, level, sfxBus); o.start(t);
    var nodes = [o, bp, stut, level].concat(ls);
    return { osc: o, bp: bp, stop: function () { endLoop(level, 0.08, [o, ls[0], ls[2]], nodes); } };
  }

  function makeWater() { // hydrant jet: filtered noise splash with slow burble LFO
    var t = ctx.currentTime;
    var n = noise(true), bp = filt('bandpass', 900, 0.8), lp = filt('lowpass', 2600);
    var amp = gainNode(0.85), level = gainNode(0);
    var burble = lfoTo(t, 'sine', 2.3, 0.15, amp.gain, 0)
      .concat(lfoTo(t, 'sine', 0.7, 300, bp.frequency, 0));
    sweep(level.gain, t, 0.0001, t + 0.2, 0.14, false);
    chain(n, bp, lp, amp, level, sfxBus); n.start(t);
    var nodes = [n, bp, lp, amp, level].concat(burble);
    return {
      setCount: function (c) { level.gain.setTargetAtTime(0.14 * Math.min(2, Math.sqrt(c)), ctx.currentTime, 0.05); },
      stop: function () { endLoop(level, 0.25, [n, burble[0], burble[2]], nodes); },
    };
  }

  var LOOP_MAKERS = { fan: makeFan, conveyor: makeConveyor, magnet: makeMagnet, balloon: makeBalloon, water: makeWater };
  function startLoop(name) {
    if (!ctx || !sfxOn || !LOOP_MAKERS[name]) return;
    var L = loops[name];
    if (L) { L.count++; if (L.setCount) L.setCount(L.count); return; }
    L = LOOP_MAKERS[name](); L.count = 1; loops[name] = L;
  }
  function stopLoop(name) {
    var L = loops[name];
    if (!L) return;
    L.count--;
    if (L.count > 0) { if (L.setCount) L.setCount(L.count); return; }
    delete loops[name];
    L.stop();
  }
  function stopAllLoops() {
    for (var k in loops) { try { loops[k].stop(); } catch (e) {} delete loops[k]; }
  }
  function setBalloonInflate(x) { // spec 1.9: tau = 50 ms tracking, filter at 2f
    var L = loops.balloon;
    if (!ctx || !L) return;
    var f = 300 + 600 * clamp(x, 0, 1), t = ctx.currentTime;
    L.osc.frequency.setTargetAtTime(f, t, 0.05);
    L.bp.frequency.setTargetAtTime(2 * f, t, 0.05);
  }

  // ---- music box (spec §2): C major, 76 bpm, 32 slots = 8 bars = 25.26 s -------
  var BEAT = 60 / 76;
  var MELODY = [
    523.25, 659.25, 783.99, 659.25,  440, 523.25, 659.25, 523.25,
    349.23, 440, 523.25, 440,        392, 493.88, 587.33, 493.88,
    523.25, 659.25, 783.99, 659.25,  440, 523.25, 659.25, 523.25,
    349.23, 440, 523.25, 440,        392, 493.88, 587.33, 783.99 // bar 8 turnaround
  ];
  var BASS = [130.8, 110, 87.3, 98, 130.8, 110, 87.3, 98];
  var mus = { timer: null, slot: 0, nextTime: 0, loopN: 0, voices: [], lp: null, bassLp: null };

  function duck(depth, t) { // §2 ducking: fast dip, restore starting at t + 2.2 s
    if (!musicBus) return;
    musicBus.gain.setTargetAtTime(depth, t, 0.05);
    musicBus.gain.setTargetAtTime(MUSIC_LEVEL, t + 2.2, 0.25);
  }
  function musicStart() {
    if (!ctx || !musicOn || mus.timer) return;
    if (!mus.lp) {
      mus.lp = filt('lowpass', 2200); mus.lp.connect(musicBus);
      mus.bassLp = filt('lowpass', 400); mus.bassLp.connect(musicBus);
    }
    mus.slot = 0; mus.loopN = 0; mus.nextTime = ctx.currentTime + 0.15;
    mus.timer = setInterval(musicTick, 200); // 200 ms lookahead scheduler
    musicTick();
  }
  function musicStop() {
    if (mus.timer) { clearInterval(mus.timer); mus.timer = null; }
    var vs = mus.voices.slice();
    for (var i = 0; i < vs.length; i++) killVoice(vs[i]);
  }
  function musicTick() {
    if (!ctx) return;
    var horizon = ctx.currentTime + 0.5;
    while (mus.nextTime < horizon) {
      scheduleSlot(mus.slot, mus.nextTime, mus.loopN);
      mus.slot++;
      if (mus.slot >= 32) { mus.slot = 0; mus.loopN++; } // wrap -> seamless loop
      mus.nextTime += BEAT;
    }
  }
  function scheduleSlot(slot, time, loopN) {
    var t = Math.max(ctx.currentTime, time + rnd(-0.012, 0.012)); // humanize timing
    var f = MELODY[slot], alt = loopN % 2 === 1;
    if (alt && slot === 7) f = 659.25; // every 2nd loop: bar 2 last note C5 -> E5
    melodyNote(t, f, rnd(0.85, 1.0));
    if (alt && slot === 14) melodyNote(t + 0.06, 1174.66, 0.3 * rnd(0.85, 1.0)); // D6 echo
    if (slot % 4 === 0) bassNote(time, BASS[slot >> 2], rnd(0.85, 1.0));
  }
  function regVoice(kind, end, g, srcs, nodes) { // track for stop/steal; self-frees
    var v = { kind: kind, end: end, g: g, srcs: srcs, nodes: nodes };
    srcs[0].onended = function () {
      var k = mus.voices.indexOf(v);
      if (k >= 0) mus.voices.splice(k, 1);
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
    for (var i = 0; i < srcs.length; i++) srcs[i].stop(end);
    mus.voices.push(v);
  }
  function melodyNote(t, f, gmul) { // sine + triangle(0.5x); max 3 ringing, steal oldest
    var alive = [], mel = [], i;
    for (i = 0; i < mus.voices.length; i++) if (mus.voices[i].end > t) alive.push(mus.voices[i]);
    mus.voices = alive;
    for (i = 0; i < alive.length; i++) if (alive[i].kind === 'm') mel.push(alive[i]);
    while (mel.length >= 3) killVoice(mel.shift());
    var det = rnd(-4, 4), o1 = osc('sine', f, t), o2 = osc('triangle', f, t);
    o1.detune.value = det; o2.detune.value = det; // humanize pitch
    var g2 = gainNode(0.5), g = gainNode(0);
    env(g.gain, t, 0.002, 0.5 * gmul, 1.2); // music-box pluck, no sustain
    chain(o1, g); chain(o2, g2, g, mus.lp);
    o1.start(t); o2.start(t);
    regVoice('m', t + 1.22, g, [o1, o2], [o1, o2, g2, g]);
  }
  function bassNote(t, f, gmul) { // pure sine whole note, 0.5x melody level
    var o = osc('sine', f, t); o.detune.value = rnd(-4, 4);
    var g = gainNode(0); env(g.gain, t, 0.02, 0.25 * gmul, 2.5);
    chain(o, g, mus.bassLp); o.start(t);
    regVoice('b', t + 2.55, g, [o], [o, g]);
  }
  function killVoice(v) {
    v.end = 0;
    try {
      var t = ctx.currentTime;
      fadeOut(v.g.gain, t, 0.05);
      for (var i = 0; i < v.srcs.length; i++) v.srcs[i].stop(t + 0.06);
    } catch (e) {}
  }

  // ---- physics event fan-in ------------------------------------------------------
  function handleEvents(events) {
    if (!ctx || !sfxOn || !events) return;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (!e) continue;
      switch (e.type) {
        case 'hit': {
          var v = clamp((e.impact || 0) / 12, 0.15, 1), a = e.matA, b = e.matB;
          if ((a === 'magnet' || b === 'magnet') && (e.impact || 0) > 3) sfx('clank', { strength: v });
          else if (a === 'marble' || b === 'marble') sfx('marble', { strength: v });
          else if (a === 'domino' || b === 'domino') sfx('dominoTick', { strength: v });
          else if (a === 'rubber' || b === 'rubber') sfx('rubber', { strength: v });
          else sfx('wood', { strength: v }); // berry/wood/other
          break;
        }
        case 'boing': sfx('tramp', { strength: clamp((e.impact || 0) / 14, 0.3, 1) }); break;
        case 'bumper': sfx('bumper', { strength: clamp((e.impact || 0) / 12, 0.15, 1) }); break;
        case 'pop': sfx('pop'); break;
        case 'bell': sfx('bell'); break;
        case 'sparkle': sfx('sparkle', { tier: clamp(((e.n || 1) | 0) - 1, 0, 2) }); break;
        case 'win': sfx('win'); break;
        case 'magnet_on': sfx('magnetClunk'); startLoop('magnet'); break;
        case 'magnet_off': stopLoop('magnet'); sfx('magnetWind'); break;
        case 'snip': sfx('snip'); break;
        case 'thwack': sfx('thwack'); break;
        case 'switch_on': sfx('switchOn'); break;
        case 'switch_off': sfx('switchOff'); break;
        case 'ignite': sfx('igniteFizz'); break;
        case 'extinguish': sfx('extinguishHiss'); break;
      }
    }
  }

  // ---- public API -----------------------------------------------------------------
  var api = {
    unlock: unlock,
    sfx: sfx,
    setSfxEnabled: function (b) { sfxOn = !!b; if (!sfxOn) stopAllLoops(); },
    setMusicEnabled: function (b) { musicOn = !!b; if (musicOn) musicStart(); else musicStop(); },
    sfxEnabled: function () { return sfxOn; },
    musicEnabled: function () { return musicOn; },
    startLoop: startLoop,
    stopLoop: stopLoop,
    stopAllLoops: stopAllLoops,
    setBalloonInflate: setBalloonInflate,
    handleEvents: handleEvents,
    music: { start: musicStart, stop: musicStop }
  };
  window.LoryAudio = api;
})();

</script>
<script>
/* ==== src/render.js ==== */
/*
 * Lory's Lab — canvas renderer. All art is drawn with Canvas 2D paths per the
 * visual identity spec (design/visual-spec.md); zero image assets.
 * Consumes the sim from core.js; never touches physics.
 */
(function () {
  'use strict';

  const C = {
    wallCream: '#FBF1DE', wallPeach: '#F5DFC3', woodLight: '#EABF85', woodMid: '#C9915A',
    woodDark: '#8F6238', ink: '#43342B', inkSoft: '#8C7A6B', paper: '#FFF9EE',
    loryBlue: '#4E86E0', blueDeep: '#3563B8', sunny: '#FFC53D', tangerine: '#FF8E3C',
    poppy: '#E8563F', leaf: '#5FB358', sky: '#7CC7E8', blossom: '#F2A0BD',
    shadow: 'rgba(67,52,43,0.12)', outline: 'rgba(67,52,43,0.35)', outlineSoft: 'rgba(67,52,43,0.3)',
  };
  const BOARD_W = 1280, BOARD_H = 720, TRAY_H = 110, FLOOR_Y = 690;
  const TAU = Math.PI * 2;

  let cv, ctx, dpr = 1, bgCache = null;
  // Full-bleed support: the canvas can be wider than the 1280px board (phones
  // in landscape). The room artwork fills viewW; the board sits centered at
  // offset ox. World/physics stay 1280 wide — this is presentation only.
  let viewW = BOARD_W;
  const boardOX = () => (viewW - BOARD_W) / 2;
  const anim = new Map();   // per-part animation state, keyed by part id
  const squash = new Map(); // bodyId -> {t, nx, ny, amt}
  let particles = [];
  let shakeT = 0;
  // "juice": presentation-only speed cues (trails, exaggerated spin, lean,
  // dust). NEVER touches physics — toggled by the ✨ button.
  let juicy = true;
  const JUICE_SPIN = 1.45;        // pattern spin exaggeration while juicy
  const JUICE_MIN_SPEED = 1.0;    // px/frame before trails/dust appear (slow
                                  // shelf rolls run at ~1.5 — keep them in)
  const BALL_TYPES = { berry: 1, ball_beach: 1, ball_marble: 1 };
  const FIST_ANIM_T = 40; // cooldown frames above this = punch extension anim

  // ---------------------------------------------------------------------------
  // small helpers
  // ---------------------------------------------------------------------------
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.roundRect(x, y, w, h, r);
  }
  function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
  function groundShadow(c, w) {
    c.save(); c.fillStyle = C.shadow;
    c.beginPath(); c.ellipse(0, 4, w * 0.45, 5, 0, 0, TAU); c.fill(); c.restore();
  }
  function star4(c, x, y, r, rot) {
    c.save(); c.translate(x, y); c.rotate(rot || 0);
    c.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      const m = a + Math.PI / 4;
      c.quadraticCurveTo(Math.cos(m) * r * 0.28, Math.sin(m) * r * 0.28,
        Math.cos(a + Math.PI / 2) * r, Math.sin(a + Math.PI / 2) * r);
    }
    c.closePath(); c.restore();
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOutBack = t => { const s = 1.2; t -= 1; return 1 + t * t * ((s + 1) * t + s); };

  function partAnim(id) {
    let a = anim.get(id);
    if (!a) { a = { spin: 0, dash: 0, swing: 0, prevString: null, magnetLerp: 0 }; anim.set(id, a); }
    return a;
  }

  // ---------------------------------------------------------------------------
  // background (cached)
  // ---------------------------------------------------------------------------
  function paintBackground() {
    const off = document.createElement('canvas');
    off.width = viewW * dpr; off.height = (BOARD_H + TRAY_H) * dpr;
    const c = off.getContext('2d');
    c.scale(dpr, dpr);
    const g = c.createLinearGradient(0, 0, 0, BOARD_H);
    g.addColorStop(0, C.wallCream); g.addColorStop(1, C.wallPeach);
    c.fillStyle = g; c.fillRect(0, 0, viewW, BOARD_H + TRAY_H);
    // polka dots
    c.fillStyle = 'rgba(201,145,90,0.07)';
    for (let y = 0, row = 0; y < FLOOR_Y - 40; y += 32, row++) {
      for (let x = (row % 2 ? 32 : 0); x < viewW; x += 64) { circle(c, x, y, 3); c.fill(); }
    }
    // crayon doodle frames (decor, top area)
    c.save(); c.globalAlpha = 0.5;
    for (const [fx, fy] of [[150, 60], [viewW - 230, 72]]) {
      c.fillStyle = 'rgba(255,249,238,0.5)'; rr(c, fx - 44, fy - 34, 88, 68, 8); c.fill();
      c.strokeStyle = C.woodMid; c.lineWidth = 4; rr(c, fx - 44, fy - 34, 88, 68, 8); c.stroke();
      c.strokeStyle = 'rgba(140,122,107,0.4)'; c.lineWidth = 2.5;
      c.beginPath();
      if (fx < viewW / 2) { // scribble sun
        c.arc(fx, fy, 14, 0, TAU);
        for (let i = 0; i < 8; i++) { const a = i * TAU / 8; c.moveTo(fx + Math.cos(a) * 18, fy + Math.sin(a) * 18); c.lineTo(fx + Math.cos(a) * 26, fy + Math.sin(a) * 26); }
      } else { // scribble bird
        c.moveTo(fx - 26, fy + 6); c.quadraticCurveTo(fx - 13, fy - 16, fx, fy + 6);
        c.quadraticCurveTo(fx + 13, fy - 16, fx + 26, fy + 6);
      }
      c.stroke();
    }
    c.restore();
    // vignette
    const vg = c.createRadialGradient(viewW / 2, BOARD_H / 2, 300, viewW / 2, BOARD_H / 2, 900);
    vg.addColorStop(0, 'rgba(67,52,43,0)'); vg.addColorStop(1, 'rgba(67,52,43,0.05)');
    c.fillStyle = vg; c.fillRect(0, 0, viewW, BOARD_H);
    // skirting + floor
    const skirtY = FLOOR_Y - 26;
    c.fillStyle = C.woodLight; c.fillRect(0, FLOOR_Y, viewW, BOARD_H - FLOOR_Y);
    c.fillStyle = C.woodMid; c.fillRect(0, skirtY, viewW, 26);
    c.fillStyle = C.woodDark; c.fillRect(0, skirtY, viewW, 3);
    c.fillStyle = 'rgba(255,249,238,0.25)'; c.fillRect(0, skirtY + 4, viewW, 1.5);
    c.fillStyle = C.shadow; c.fillRect(0, FLOOR_Y, viewW, 6);
    c.strokeStyle = 'rgba(143,98,56,0.15)'; c.lineWidth = 1.5;
    for (let x = 48; x < viewW; x += 96) { c.beginPath(); c.moveTo(x, FLOOR_Y + 6); c.lineTo(x, BOARD_H); c.stroke(); }
    // when the room is wider than the board, mark the bench ends with subtle
    // wooden posts so the invisible physics walls read as intentional
    if (viewW > BOARD_W + 4) {
      const ox = boardOX();
